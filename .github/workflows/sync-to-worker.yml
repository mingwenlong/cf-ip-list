name: Sync GitHub raw ip.txt to Worker ADD.txt (Every 30 minutes)

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分钟执行一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download ip.txt from GitHub raw
        run: |
          curl -fsSL https://raw.githubusercontent.com/mingwenlong/cf-ip-list/refs/heads/main/ip.txt -o ip.txt
          if [ ! -f "ip.txt" ] || [ ! -s "ip.txt" ]; then
            echo "::error::Failed to download ip.txt"
            exit 1
          fi
          echo "✅ Downloaded ip.txt"

      - name: Login to Worker and get auth cookie
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          UA: GitHub-Actions-Sync/1.0
        run: |
          # 登录并保存 Cookie
          curl -fsSL \
            -c cookies.txt \
            -H "User-Agent: $UA" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "password=$ADMIN_PASSWORD" \
            "$WORKER_URL/login" > login_response.txt

          # 检查登录是否成功（修复：去掉空格，精确匹配）
          if ! grep -q '"success":true' login_response.txt; then
            echo "::error::Login failed. Response:"
            cat login_response.txt
            exit 1
          fi
          echo "✅ Logged in to Worker"

      - name: Push ip.txt to ADD.txt
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          UA: GitHub-Actions-Sync/1.0
        run: |
          response=$(curl -w "%{http_code}" -sS \
            -X POST \
            -b cookies.txt \
            -H "User-Agent: $UA" \
            -H "Content-Type: text/plain; charset=utf-8" \
            --data-binary "@ip.txt" \
            "$WORKER_URL/admin/ADD.txt")

          http_code=${response: -3}
          if [ "$http_code" != "200" ]; then
            echo "::error::Push failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Pushed ip.txt to ADD.txt"

      - name: Verify sync result
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          UA: GitHub-Actions-Sync/1.0
        run: |
          current=$(curl -s -b cookies.txt -H "User-Agent: $UA" "$WORKER_URL/admin/ADD.txt")
          local=$(cat ip.txt)
          if [ "$current" = "$local" ]; then
            echo "✅ ADD.txt matches ip.txt"
          else
            echo "::warning::ADD.txt does not match ip.txt"
          fi
